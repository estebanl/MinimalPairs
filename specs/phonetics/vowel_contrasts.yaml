version: "1.0"

contrast_pairs:
  - id: "i_vs_I"
    target_phonemes: ["iː", "ɪ"]
    description: "Close front unrounded vs. Near-close near-front unrounded"
    examples:
      - pair: ["sheep", "ship"]
      - pair: ["feet", "fit"]
      - pair: ["seat", "sit"]
      - pair: ["leak", "lick"]
      - pair: ["cheeks", "chicks"]
    acoustic_bounds:
      phoneme_1: # /iː/
        f1_range_hz: [250, 380]
        f2_range_hz: [2100, 2600]
        min_duration_ms: 120
      phoneme_2: # /ɪ/
        f1_range_hz: [380, 520]
        f2_range_hz: [1700, 2100]
        max_duration_ms: 100
    visual_indicators:
      lip_aperture_ratio: 0.15
      jaw_drop_mm: [5, 12]

  - id: "ae_vs_e"
    target_phonemes: ["æ", "e"]
    description: "Near-open front unrounded vs. Open-mid front unrounded"
    examples:
      - pair: ["bad", "bed"]
      - pair: ["man", "men"]
      - pair: ["pan", "pen"]
      - pair: ["sad", "said"]
      - pair: ["cattle", "kettle"]
    acoustic_bounds:
      phoneme_1: # /æ/
        f1_range_hz: [660, 860]
        f2_range_hz: [1500, 1900]
        min_duration_ms: 140
      phoneme_2: # /e/
        f1_range_hz: [500, 660]
        f2_range_hz: [1700, 2100]
        max_duration_ms: 110
    visual_indicators:
      lip_aperture_ratio: 0.35
      jaw_drop_mm: [14, 22]

  - id: "a_vs_uh"
    target_phonemes: ["ɑː", "ʌ"]
    description: "Open back unrounded vs. Open-mid back unrounded"
    examples:
      - pair: ["heart", "hut"]
      - pair: ["calm", "come"]
      - pair: ["dark", "duck"]
      - pair: ["march", "much"]
      - pair: ["barn", "bun"]
    acoustic_bounds:
      phoneme_1: # /ɑː/
        f1_range_hz: [680, 850]
        f2_range_hz: [1050, 1300]
        min_duration_ms: 150
      phoneme_2: # /ʌ/
        f1_range_hz: [580, 720]
        f2_range_hz: [1250, 1500]
        max_duration_ms: 100
    visual_indicators:
      lip_aperture_ratio: 0.40
      jaw_drop_mm: [16, 24]

  - id: "u_vs_uu"
    target_phonemes: ["ʊ", "uː"]
    description: "Near-close near-back rounded vs. Close back rounded"
    examples:
      - pair: ["full", "fool"]
      - pair: ["pull", "pool"]
      - pair: ["look", "luke"]
      - pair: ["soot", "suit"]
      - pair: ["stood", "stewed"]
    acoustic_bounds:
      phoneme_1: # /ʊ/
        f1_range_hz: [400, 520]
        f2_range_hz: [1200, 1500]
        max_duration_ms: 100
      phoneme_2: # /uː/
        f1_range_hz: [280, 380]
        f2_range_hz: [800, 1200]
        min_duration_ms: 130
    visual_indicators:
      lip_aperture_ratio: 0.12
      jaw_drop_mm: [6, 12]

  - id: "o_vs_or"
    target_phonemes: ["ɒ", "ɔː"]
    description: "Open back rounded vs. Open-mid back rounded"
    examples:
      - pair: ["cot", "caught"]
      - pair: ["shot", "short"]
      - pair: ["pot", "port"]
      - pair: ["spot", "sport"]
      - pair: ["fox", "forks"]
    acoustic_bounds:
      phoneme_1: # /ɒ/
        f1_range_hz: [550, 720]
        f2_range_hz: [900, 1200]
        max_duration_ms: 110
      phoneme_2: # /ɔː/
        f1_range_hz: [400, 560]
        f2_range_hz: [750, 1050]
        min_duration_ms: 140
    visual_indicators:
      lip_aperture_ratio: 0.28
      jaw_drop_mm: [12, 18]

  - id: "e_vs_I"
    target_phonemes: ["e", "ɪ"]
    description: "Open-mid front unrounded vs. Near-close near-front unrounded"
    examples:
      - pair: ["pen", "pin"]
      - pair: ["ten", "tin"]
      - pair: ["bet", "bit"]
      - pair: ["set", "sit"]
      - pair: ["dead", "did"]
    acoustic_bounds:
      phoneme_1: # /e/
        f1_range_hz: [500, 660]
        f2_range_hz: [1700, 2100]
        min_duration_ms: 110
      phoneme_2: # /ɪ/
        f1_range_hz: [380, 520]
        f2_range_hz: [1700, 2100]
        max_duration_ms: 100
    visual_indicators:
      lip_aperture_ratio: 0.25
      jaw_drop_mm: [10, 16]
