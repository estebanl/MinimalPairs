openapi: 3.0.3
info:
  title: Phoneme Scorer Service
  version: 2.1.0
  description: Local phoneme CTC alignment and uncalibrated posterior confidence; no model downloads during requests

paths:
  /v1/score/phoneme:
    post:
      summary: Align expected IPA and estimate model confidence
      operationId: scorePhoneme
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio_file
                - target_transcript
                - expected_ipa
              properties:
                audio_file:
                  type: string
                  format: binary
                  description: 16kHz 16-bit mono PCM WAV, 80ms to 30 seconds, at most 1 MB
                target_transcript:
                  type: string
                  example: "sheep"
                expected_ipa:
                  type: string
                  example: "ʃ iː p"
                  description: Space-separated model IPA tokens matching the utterance. The current model rejects single-phoneme tasks as unsupported; multi-phoneme scoring remains experimental.
                target_phoneme_index:
                  type: integer
                  minimum: 0
                  description: Optional zero-based occurrence in expected_ipa. Returns segment-local confidence for this phoneme, not a word average. Requires a full multi-phoneme word transcript.
      responses:
        '200':
          description: Successful evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonemeScoringResponse'
        '400':
          description: Invalid/unsupported input, or a recording that cannot be scored reliably. No score is returned.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    oneOf:
                      - type: string
                      - type: object
                        required: [code, message]
                        properties:
                          code:
                            type: string
                            enum: [no_clear_speech, noisy_audio, clipped_audio, multiple_utterances, uncertain_alignment]
                          message:
                            type: string
        '413':
          description: Audio exceeds 1 MB
        '503':
          description: Model not configured, not loadable, or inference failed

components:
  schemas:
    PhonemeScore:
      type: object
      required:
        - phoneme
        - gop_score
        - start_time
        - end_time
      properties:
        phoneme:
          type: string
          example: "iː"
        gop_score:
          type: number
          format: float
          description: Uncalibrated model confidence, 0-100. Segment-local posterior for neural_ctc_phoneme; sequence-penalized posterior for neural_ctc. Legacy field name.
          example: 92.4
        start_time:
          type: number
          format: float
          description: CTC token-emission start in seconds; not a validated phonetic boundary
          example: 0.18
        end_time:
          type: number
          format: float
          description: CTC token-emission end in seconds; not a vowel-duration measurement
          example: 0.36

    PhonemeScoringResponse:
      type: object
      required:
        - overall_score
        - phonemes
        - scoring_method
        - model_id
      properties:
        overall_score:
          type: number
          format: float
          description: Selected phoneme confidence when target_phoneme_index is supplied; otherwise mean phoneme confidence. Not a calibrated pronunciation grade.
          example: 88.5
        phonemes:
          type: array
          items:
            $ref: '#/components/schemas/PhonemeScore'
        scoring_method:
          type: string
          enum: [neural_ctc, neural_ctc_phoneme]
        target_phoneme_index:
          type: integer
          nullable: true
          description: Echoes the selected occurrence for neural_ctc_phoneme; null otherwise.
        model_id:
          type: string
          description: Operator-supplied checkpoint and revision identifier
        feedback:
          type: string
          description: Explanation of score limitations
