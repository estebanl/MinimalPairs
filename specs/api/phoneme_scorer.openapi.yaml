openapi: 3.0.3
info:
  title: Phoneme Scorer Service
  version: 2.0.0
  description: Local phoneme CTC alignment and uncalibrated posterior confidence; no model downloads during requests

paths:
  /v1/score/phoneme:
    post:
      summary: Align expected IPA and estimate model confidence
      operationId: scorePhoneme
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio_file
                - target_transcript
                - expected_ipa
              properties:
                audio_file:
                  type: string
                  format: binary
                  description: 16kHz 16-bit mono PCM WAV, 80ms to 30 seconds, at most 1 MB
                target_transcript:
                  type: string
                  example: "sheep"
                expected_ipa:
                  type: string
                  example: "ʃ iː p"
                  description: Space-separated model IPA tokens matching the utterance. The current model rejects single-phoneme tasks as unsupported; multi-phoneme scoring remains experimental.
      responses:
        '200':
          description: Successful evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhonemeScoringResponse'
        '400':
          description: Bad request, unsupported audio format, or unsupported isolated-phoneme task
        '413':
          description: Audio exceeds 1 MB
        '503':
          description: Model not configured, not loadable, or inference failed

components:
  schemas:
    PhonemeScore:
      type: object
      required:
        - phoneme
        - gop_score
        - start_time
        - end_time
      properties:
        phoneme:
          type: string
          example: "iː"
        gop_score:
          type: number
          format: float
          description: Uncalibrated aligned posterior confidence with sequence-agreement penalty, 0-100; legacy field name
          example: 92.4
        start_time:
          type: number
          format: float
          description: CTC token-emission start in seconds; not a validated phonetic boundary
          example: 0.18
        end_time:
          type: number
          format: float
          description: CTC token-emission end in seconds; not a vowel-duration measurement
          example: 0.36

    PhonemeScoringResponse:
      type: object
      required:
        - overall_score
        - phonemes
        - scoring_method
        - model_id
      properties:
        overall_score:
          type: number
          format: float
          description: Mean phoneme confidence 0-100; not a calibrated pronunciation grade
          example: 88.5
        phonemes:
          type: array
          items:
            $ref: '#/components/schemas/PhonemeScore'
        scoring_method:
          type: string
          enum: [neural_ctc]
        model_id:
          type: string
          description: Operator-supplied checkpoint and revision identifier
        feedback:
          type: string
          description: Explanation of score limitations
