version: "1.0"

stories:
  - id: "sheep_vs_ship"
    contrast_id: "i_vs_I"
    title: "The Farmer's Fleet"
    premise: "You are visiting a cozy countryside petting farm to adopt a fluffy companion."
    intended_word: "sheep"
    intended_ipa: "ʃ iː p"
    trap_word: "ship"
    trap_ipa: "ʃ ɪ p"
    target_phrase: "Can I have that sheep, please?"
    target_phrase_ipa: "k ə n aɪ h æ v ð æ t ʃ iː p p l iː z"
    target_phoneme_index: 11 # Zero-based index in target_phrase_ipa
    panels:
      - index: 1
        character: "Old Farmer Giles"
        dialogue: "Welcome to Giles' Farm! What gentle creature would you like to adopt today?"
        prompt_instruction: "Ask for a sheep: 'Can I have that sheep, please?'"
      - index: 2
        intended:
          illustration_emoji: "🐑 🏡 ✨"
          sound_effect: "BAAA! ❤️"
          dialogue: "Splendid choice! Little Barnaby here will graze happily in your meadow."
          outcome_description: "Success! Perfect /iː/ pronunciation. You adopted a happy sheep."
        trap:
          illustration_emoji: "🚢 💥 🚜 😱"
          sound_effect: "HOOOORN! CRUNCH!"
          dialogue: "A SHIP?! Good heavens, where am I going to dock an ocean freighter on dry pasture?!"
          outcome_description: "Trap triggered! /ɪ/ was detected instead of /iː/. A 50,000-ton cargo vessel demolished the cornfield."
    semantic_takeaway: "The difference between close front tense /iː/ and lax /ɪ/ is the difference between a 40kg barnyard animal and a 50,000-ton nautical vessel!"

  - id: "pen_vs_pan"
    contrast_id: "ae_vs_e"
    title: "The Exam Frying Trap"
    premise: "You sit down at the university examination hall, but your writing instrument is missing."
    intended_word: "pen"
    intended_ipa: "p e n"
    trap_word: "pan"
    trap_ipa: "p æ n"
    target_phrase: "Excuse me, could you lend me a pen?"
    target_phrase_ipa: "ɪ k s k j uː z m iː k ʊ d j uː l e n d m iː ə p e n"
    target_phoneme_index: 22
    panels:
      - index: 1
        character: "Strict Professor Smith"
        dialogue: "The exam starts in two minutes. All students must have an ink utensil ready."
        prompt_instruction: "Ask the proctor: 'Excuse me, could you lend me a pen?'"
      - index: 2
        intended:
          illustration_emoji: "🖊️ 📝 🎓"
          sound_effect: "CLICK!"
          dialogue: "Certainly, here is a black ballpoint pen. Best of luck on your linguistics paper!"
          outcome_description: "Success! Mid-front /e/ clearly produced. You passed the exam."
        trap:
          illustration_emoji: "🍳 🔥 🥓 😳"
          sound_effect: "SIZZLE! CLANG!"
          dialogue: "A PAN?! Why on earth would you need a heavy cast-iron skillet for a written exam?!"
          outcome_description: "Trap triggered! Open /æ/ produced instead of /e/. The professor slams a frying pan on your desk."
    semantic_takeaway: "Failing to narrow your jaw drop from open /æ/ (pan) to mid-front /e/ (pen) turns writing an essay into frying bacon!"

  - id: "heart_vs_hut"
    contrast_id: "a_vs_uh"
    title: "The Valentine Shelter"
    premise: "You are writing a romantic love poem to your sweetheart on Valentine's Day."
    intended_word: "heart"
    intended_ipa: "h ɑː t"
    trap_word: "hut"
    trap_ipa: "h ʌ t"
    target_phrase: "You hold the key to my heart."
    target_phrase_ipa: "j uː h əʊ l d ð ə k iː t ə m aɪ h ɑː t"
    target_phoneme_index: 15
    panels:
      - index: 1
        character: "Cupid's Florist"
        dialogue: "What romantic message would you like engraved across the gold pendant?"
        prompt_instruction: "Dictate: 'You hold the key to my heart.'"
      - index: 2
        intended:
          illustration_emoji: "❤️ 🌹 💍"
          sound_effect: "Awww! 💕"
          dialogue: "How utterly poetic! 'Key to my heart' is engraved in fine italic script."
          outcome_description: "Success! Deep open back /ɑː/ lengthened properly."
        trap:
          illustration_emoji: "🛖 🔨 🪵 🤨"
          sound_effect: "THUD! THUMP!"
          dialogue: "'Key to my HUT'?! Are you locking your sweetheart into a wooden shed in the woods?!"
          outcome_description: "Trap triggered! Short central /ʌ/ produced. The florist engraves a dilapidated mud hut."
    semantic_takeaway: "Open back /ɑː/ requires long duration and tongue retraction; shortening it into /ʌ/ turns romance into a shed!"

  - id: "fool_vs_full"
    contrast_id: "u_vs_uu"
    title: "The Royal Banquet"
    premise: "The Emperor's grand feast is ending and the waiter offers you a fifth slice of roast beef."
    intended_word: "full"
    intended_ipa: "f ʊ l"
    trap_word: "fool"
    trap_ipa: "f uː l"
    target_phrase: "No thank you, I am completely full."
    target_phrase_ipa: "n əʊ θ æ ŋ k j uː aɪ æ m k ə m p l iː t l i f ʊ l"
    target_phoneme_index: 21
    panels:
      - index: 1
        character: "The Emperor's Butler"
        dialogue: "Would your lordship care for another roasted boar tenderloin?"
        prompt_instruction: "Decline politely: 'No thank you, I am completely full.'"
      - index: 2
        intended:
          illustration_emoji: "🍷 🍽️ 👑"
          sound_effect: "CLINK!"
          dialogue: "Very good, my lord. We shall bring the digestifs shortly."
          outcome_description: "Success! Lax near-close near-back /ʊ/ politely declined the dish."
        trap:
          illustration_emoji: "🃏 🎪 🤹 😡"
          sound_effect: "GASP!"
          dialogue: "'You are completely FOOL'?! Did you just insult his Majesty's court jester?!"
          outcome_description: "Trap triggered! Tense close back /uː/ produced. Guards escort you to the dungeon."
    semantic_takeaway: "Tensing lips and raising tongue to /uː/ turns satiation ('full') into an insult ('fool')!"

  - id: "pot_vs_port"
    contrast_id: "o_vs_or"
    title: "The Cooking Shop Mix-up"
    premise: "You are buying a saucepan for a cooking class at a little kitchen shop."
    intended_word: "pot"
    intended_ipa: "p ɒ t"
    trap_word: "port"
    trap_ipa: "p ɔː t"
    target_phrase: "Can I have a pot, please?"
    target_phrase_ipa: "k ə n aɪ h æ v ə p ɒ t p l iː z"
    target_phoneme_index: 9
    panels:
      - index: 1
        character: "Chef Oliver"
        dialogue: "Welcome to the kitchen shop! What do you need for your soup?"
        prompt_instruction: "Ask for a pot: 'Can I have a pot, please?'"
      - index: 2
        intended:
          illustration_emoji: "🍲 🥄 🧑‍🍳"
          sound_effect: "CLINK!"
          dialogue: "One sturdy cooking pot! Your vegetable soup will be ready in no time."
          outcome_description: "The chef brings a cooking pot for your soup."
        trap:
          illustration_emoji: "🍷 🍾 😲"
          sound_effect: "POP!"
          dialogue: "Port? Here is a bottle of sweet wine. That is a rather unusual soup ingredient!"
          outcome_description: "The chef brings port wine instead of a cooking pot."
    semantic_takeaway: "In this British English contrast, pot has the open rounded vowel /ɒ/; port has the higher, longer /ɔː/. A small vowel change swaps cookware for wine."

  - id: "pen_vs_pin"
    contrast_id: "e_vs_I"
    title: "The Prickly Autograph"
    premise: "You are signing a poster at an art fair, but you have nothing to write with."
    intended_word: "pen"
    intended_ipa: "p e n"
    trap_word: "pin"
    trap_ipa: "p ɪ n"
    target_phrase: "Please pass me a pen."
    target_phrase_ipa: "p l iː z p ɑː s m iː ə p e n"
    target_phoneme_index: 11
    panels:
      - index: 1
        character: "The Art Fair Assistant"
        dialogue: "Your first fan is waiting for an autograph! What shall I pass you?"
        prompt_instruction: "Ask for a pen: 'Please pass me a pen.'"
      - index: 2
        intended:
          illustration_emoji: "🖊️ 🎨 ⭐"
          sound_effect: "SCRIBBLE!"
          dialogue: "Here is a marker pen. Now you can sign your masterpiece!"
          outcome_description: "The assistant hands you a pen and you sign the poster."
        trap:
          illustration_emoji: "📌 🖼️ 😬"
          sound_effect: "PRICK!"
          dialogue: "A pin? I can hang the poster up, but I would not try writing with this!"
          outcome_description: "The assistant brings a sharp pin instead of a pen."
    semantic_takeaway: "Pen uses the mid-front vowel /e/ and pin uses the higher /ɪ/. Keep your tongue a little lower for pen so your autograph does not turn into a pinhole."

  - id: "cat_vs_cut"
    contrast_id: "ae_vs_uh"
    title: "The Portrait First-aid Kit"
    premise: "At a pet portrait studio, your kitten has curled up on your sleeve."
    intended_word: "cat"
    intended_ipa: "k æ t"
    trap_word: "cut"
    trap_ipa: "k ʌ t"
    target_phrase: "Look at the cat on my arm."
    target_phrase_ipa: "l ʊ k ə t ð ə k æ t ɒ n m aɪ ɑː m"
    target_phoneme_index: 8
    panels:
      - index: 1
        character: "The Pet Portrait Artist"
        dialogue: "Hold still while I find my pencils. What is that on your arm?"
        prompt_instruction: "Point out your pet: 'Look at the cat on my arm.'"
      - index: 2
        intended:
          illustration_emoji: "🐈 🎨 🖌️"
          sound_effect: "PURR!"
          dialogue: "What a lovely cat! I will draw those whiskers before our little model moves."
          outcome_description: "The artist sketches the cat resting on your arm."
        trap:
          illustration_emoji: "🩹 🧰 😟"
          sound_effect: "RUSTLE!"
          dialogue: "A cut on your arm? Put the portrait on hold! I will fetch the first-aid kit."
          outcome_description: "The artist rushes for a bandage instead of drawing your cat."
    semantic_takeaway: "Cat uses the open front vowel /æ/; cut uses the more central /ʌ/. Moving the vowel changes a pet portrait into a first-aid visit."
